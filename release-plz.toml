[workspace]
# rotom is a binary toolchain, not published to crates.io. Determine the
# current version from git tags and explicitly skip `cargo publish`.
git_only = true
publish = false

# Emit one shared `v{version}` tag and release for the whole toolchain.
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# Lock both crates to the same version so each release produces a single tag.
[[package]]
name = "rotom"
version_group = "rotom"

[[package]]
name = "rotom-lsp"
version_group = "rotom"
# `rotom` owns the shared version tag and GitHub release.
git_tag_enable = false
git_release_enable = false
