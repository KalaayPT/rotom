[package]
name = "rotom-lsp"
version = "0.1.1"
edition = "2024"
authors = ["Kalaay"]
description = "Language Server Protocol implementation for the Rotom scripting language"
license = "MIT"
repository = "https://github.com/KalaayPT/rotom"

[dependencies]
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rotom = { path = ".." }
uxie = "0.8.5"
dashmap = "6"

[dev-dependencies]
tempfile = "3"
