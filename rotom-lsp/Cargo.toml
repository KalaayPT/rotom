[package]
name = "rotom-lsp"
version = "0.1.0"
edition = "2024"
authors = ["Rotom Contributors"]
description = "Language Server Protocol implementation for the Rotom scripting language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KalaayPT/rotom-lang"

[dependencies]
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rotom = { path = ".." }
uxie = { path = "../../uxie" }
# tree-sitter-rotom = { path = "../tree-sitter-rotom" }  # future: for incremental parsing
lsp-types = "0.95"
dashmap = "6"

[profile.release]
debug = true
