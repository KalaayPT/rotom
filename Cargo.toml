[workspace]
members = [".", "rotom-lsp"]
resolver = "2"

[package]
name = "rotom"
version = "0.6.0"
edition = "2024"
description = "scripting language and toolchain for pokemon gen 4 game scripts"
authors = ["Kalaay"]
license = "MIT"
repository = "https://github.com/KalaayPT/rotom"

[lib]
name = "rotom"
path = "src/lib.rs"

[[bin]]
name = "rotom"
path = "src/main.rs"

[dependencies]
chrono = {version = "0.4.42", features = ["serde"]}
clap = { version = "4.5.51", features = ["derive"] }
codespan-reporting = "0.13.1"
dashmap = "6.1.0"
lsp-types = { version = "0.97", optional = true }
linked_hash_set = "0.1.6"
rayon = "1.11.0"
regex = "1.12.2"
serde = {version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
minreq = { version = "3.0.0", features = ["https-rustls"] }
snafu = "0.9"
toml = "1"
uxie = "0.9.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
indicatif = { version = "0.18.4", features = ["rayon"] }

[build-dependencies]
minreq = { version = "3.0.0", features = ["https-rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
sha2 = "0.11"
hex = "0.4"
tempfile = "3.23.0"

[features]
lsp-types = ["dep:lsp-types"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
use_self = "allow"
uninlined_format_args = "allow"
option_if_let_else = "allow"
missing_const_for_fn = "allow"
