[package]
name = "rotom"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = {version = "0.4.42", features = ["serde"]}
clap = { version = "4.5.51", features = ["derive"] }
linked_hash_set = "0.1.6"
rayon = "1.11.0"
regex = "1.12.2"
serde = {version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[profile.release]
debug = true
