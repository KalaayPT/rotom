[package]
name = "rotom"
version = "0.1.0"
edition = "2024"

[lib]
name = "rotom"
path = "src/lib.rs"

[[bin]]
name = "rotom"
path = "src/main.rs"

[dependencies]
chrono = {version = "0.4.42", features = ["serde"]}
clap = { version = "4.5.51", features = ["derive"] }
codespan-reporting = "0.13.1"
hex = "0.4"
linked_hash_set = "0.1.6"
rayon = "1.11.0"
regex = "1.12.2"
serde = {version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"
hex = "0.4"

[profile.release]
debug = true
